<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#126b73">
  <title>Bestand · Eisfach</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body data-page="inventory">
  <header><div class="brand"><a href="./app.html">❄ Eisfach</a><span id="inventory-name" class="inventory-name">Dein Inventar</span></div><nav aria-label="Hauptnavigation"></nav></header>
  <main>
    <h1 id="view-title">Bestand</h1>
    <p id="status" role="status"></p>
    <p id="loading" class="notice" role="status">Produkte werden abgerufen</p>
    <div class="toolbar">
      <label>Suche<input id="search" type="search" placeholder="Name, Notizen, Lagerort …"></label>
      <label id="stock-filter" class="checkbox-label" hidden><input id="only-with-stock" type="checkbox"> Nur mit Bestand</label>
      <label id="compact-view-control" class="checkbox-label" hidden><input id="compact-view" type="checkbox"> Kompakte Ansicht</label>
      <button id="add-item" type="button" hidden>Produkt anlegen</button>
    </div>
    <div id="category-filters" class="category-filters" role="group" aria-label="Kategorien"></div>
    <p id="empty" hidden></p>
    <div id="items" class="grid"></div>
    <dialog id="item-dialog">
      <form id="item-form">
        <h2 id="editor-title">Produkt anlegen</h2>
        <input name="id" type="hidden">
        <label>Name<input name="name" required maxlength="200"></label>
        <label>Produktnummer<input name="product_number" maxlength="100"></label>
        <label>Kategorie<input name="category" maxlength="100" list="categories"></label>
        <datalist id="categories"></datalist>
        <label>Produktseite (optional)<input name="product_url" type="url" placeholder="https://…"></label>
        <div class="columns product-pack-fields">
          <label>Gewicht pro Packung (g, optional)<input name="weight_grams" type="number" min="0" max="999999999.999" step="0.001"></label>
          <label>Teile (optional)<input name="parts" type="text"></label>
        </div>
        <label>Beschreibung<textarea name="description" maxlength="2000"></textarea></label>
        <label class="checkbox-label"><input name="favorite" type="checkbox"> Favorit</label>
        <fieldset class="product-rating">
          <legend>Rating (optional, 0–5)</legend>
          <div class="rating-stars">
            <label><input name="rating" type="radio" value="1" aria-label="1 Stern"><span aria-hidden="true">★</span></label>
            <label><input name="rating" type="radio" value="2" aria-label="2 Sterne"><span aria-hidden="true">★</span></label>
            <label><input name="rating" type="radio" value="3" aria-label="3 Sterne"><span aria-hidden="true">★</span></label>
            <label><input name="rating" type="radio" value="4" aria-label="4 Sterne"><span aria-hidden="true">★</span></label>
            <label><input name="rating" type="radio" value="5" aria-label="5 Sterne"><span aria-hidden="true">★</span></label>
          </div>
          <div class="rating-options">
            <label class="checkbox-label"><input name="rating" type="radio" value="0"> 0 Sterne</label>
            <label class="checkbox-label"><input name="rating" type="radio" value="" checked> Keine Bewertung</label>
          </div>
        </fieldset>
        <p>Nutzungscounter: <output id="item-usage-count">0</output></p>
        <div class="columns">
          <label>Zubereitungszeit (Minuten)<input name="preparation_minutes" type="number" min="0" max="2147483647" step="1"></label>
          <label>Auftauzeit (Minuten, optional)<input name="thawing_minutes" type="number" min="0" max="2147483647" step="1"></label>
        </div>
        <label>Notizen<textarea name="notes" maxlength="4000"></textarea></label>
        <div id="editor-images" class="images" aria-label="Vorhandene Produktbilder"></div>
        <label>Bilder hinzufügen<input name="images" type="file" accept="image/*" multiple></label>
        <p>Bilder werden auf maximal 1600 Pixel verkleinert und als WebP gespeichert.</p>
        <p id="editor-status" role="status"></p>
        <div class="actions">
          <button id="delete-item" type="button" class="danger" hidden>Produkt löschen</button>
          <button type="submit">Speichern</button>
          <button id="cancel-item" type="button" class="secondary">Schließen</button>
        </div>
      </form>
    </dialog>
    <dialog id="stock-dialog" aria-labelledby="stock-title">
      <form id="stock-form">
        <h2 id="stock-title">Bestand hinzufügen</h2>
        <input name="id" type="hidden">
        <div id="stock-product-picker">
          <label>Produktnummer<input name="product_number_search" type="search" maxlength="100" placeholder="Produkte nach Nummer filtern"></label>
          <label>Produkt<select name="item_id" required></select></label>
          <button id="stock-new-item" type="button" class="secondary">Neues Produkt anlegen</button>
        </div>
        <div id="stock-product-details" hidden>
          <p id="stock-subtitle" class="muted"></p>
          <div id="stock-detail-image" class="stock-detail-image"></div>
          <p id="stock-description" class="stock-description"></p>
          <p id="stock-preparation"></p>
          <p id="stock-thawing"></p>
          <div id="stock-product-metadata"></div>
        </div>
        <p id="stock-product-weight"></p>
        <div id="stock-location-picker">
          <div class="columns">
            <label>Ort<select name="location_id" required></select></label>
            <label>Fach (optional)<select name="compartment_id"><option value="">Ohne Fach</option></select></label>
          </div>
          <p>Orte und Fächer unter <a href="./freezer.html">Einstellungen → Orte und Fächer</a> verwalten.</p>
        </div>
        <p id="stock-current-location" hidden></p>
        <div class="stock-quantity-actions">
          <div class="stock-quantity">
            <label id="stock-quantity-label" for="stock-quantity">Stückzahl</label>
            <div class="quantity-control">
              <button id="quantity-down" type="button" class="secondary" aria-label="Stückzahl verringern">-</button>
              <input id="stock-quantity" name="quantity" type="number" min="0" max="2147483647" step="1" required value="1">
              <button id="quantity-up" type="button" class="secondary" aria-label="Stückzahl erhöhen">+</button>
            </div>
          </div>
          <div id="stock-position-actions" class="actions" hidden>
            <button id="relocate-stock" type="button" class="secondary">Umlagern</button>
            <button id="additional-stock" type="button" class="secondary">Weiteren Bestand erfassen</button>
          </div>
        </div>
        <p id="stock-status" role="status"></p>
        <div class="actions">
          <button id="delete-stock" type="button" class="danger" hidden>Position entfernen</button>
          <button type="submit">Speichern</button>
          <button id="cancel-stock" type="button" class="secondary">Schließen</button>
        </div>
      </form>
    </dialog>
    <dialog id="stock-action-dialog" aria-labelledby="stock-action-title">
      <form id="stock-action-form">
        <h2 id="stock-action-title"></h2>
        <p id="stock-action-info"></p>
        <div id="stock-action-quantity-control">
          <label for="stock-action-quantity">Zusätzliche Stückzahl</label>
          <div class="quantity-control">
            <button id="stock-action-down" type="button" class="secondary" aria-label="Zusätzliche Stückzahl verringern">-</button>
            <input id="stock-action-quantity" name="quantity" type="number" min="1" max="2147483647" step="1" required value="1">
            <button id="stock-action-up" type="button" class="secondary" aria-label="Zusätzliche Stückzahl erhöhen">+</button>
          </div>
        </div>
        <label>Ort<select name="location_id" required></select></label>
        <label>Fach (optional)<select name="compartment_id"><option value="">Ohne Fach</option></select></label>
        <p id="stock-action-status" role="status"></p>
        <div class="actions">
          <button type="submit">Speichern</button>
          <button id="cancel-stock-action" type="button" class="secondary">Abbrechen</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
